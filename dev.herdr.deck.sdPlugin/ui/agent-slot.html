<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent Slot</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <!--
      Slot is 0-based in settings (array index into agent.list).
      Labels are 1-based. Leave unset / pick Auto to use key position:
      top-left = 1, reading order left-to-right, top-to-bottom.
    -->
    <sdpi-item label="Slot">
      <sdpi-select
        setting="slot"
        value-type="number"
        placeholder="Auto (key position)"
      >
        <option value="0">1</option>
        <option value="1">2</option>
        <option value="2">3</option>
        <option value="3">4</option>
        <option value="4">5</option>
        <option value="5">6</option>
        <option value="6">7</option>
        <option value="7">8</option>
        <option value="8">9</option>
        <option value="9">10</option>
        <option value="10">11</option>
        <option value="11">12</option>
        <option value="12">13</option>
        <option value="13">14</option>
        <option value="14">15</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Tip">
      <details class="message">
        <summary>How slots work</summary>
        <p>
          Slot N is the Nth agent in Herdr's panel order. Drop keys on the top
          two rows left-to-right and they auto-map to slots 1–10. Override here
          only if you need a custom order.
        </p>
      </details>
    </sdpi-item>
  </body>
</html>
